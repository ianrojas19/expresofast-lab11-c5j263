<div class="card" style="max-width: 600px; margin: 0 auto;">
  <h2>Registrar Nuevo Envío</h2>
  <form (ngSubmit)="registrar()" #envioForm="ngForm">
    <div class="form-group">
      <label for="destinatario">Destinatario:</label>
      <input type="text" id="destinatario" name="destinatario" [(ngModel)]="payload.destinatario" required class="form-control" placeholder="Nombre completo">
    </div>
    <div class="form-group">
      <label for="direccionDestino">Dirección Destino:</label>
      <input type="text" id="direccionDestino" name="direccionDestino" [(ngModel)]="payload.direccionDestino" required class="form-control" placeholder="Dirección exacta">
    </div>
    <div class="form-group">
      <label for="montoFlete">Monto Flete (₡):</label>
      <input type="number" id="montoFlete" name="montoFlete" [(ngModel)]="payload.montoFlete" required class="form-control" placeholder="0.00">
    </div>
    <div style="margin-top: 2rem;">
      <button type="submit" class="btn btn-primary" [disabled]="!envioForm.valid" style="width: 100%;">Registrar Envío</button>
    </div>
  </form>
</div>
